[project]
name = "dopamine-backend"
version = "0.1.0"
description = "DopaMine backend: FSRS-scheduled flashcards with a gamification layer."
requires-python = ">=3.12"
dependencies = [
    "anki>=25.0",
    "fsrs>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
