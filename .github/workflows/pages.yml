# Deploys the DopaMine frontend as a BACKEND-LESS demo (mock mode) to GitHub Pages.
# Pages serves static files only — it cannot run the Python backend, so this build
# forces mock mode (VITE_FORCE_MOCK=1): the swipe/grade/reward/streak loop is fully
# playable but faked in-browser. Real FSRS scheduling, .apkg import, media, and
# AnkiWeb sync require running the backend (see README "Run it on your phone").
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build demo (mock mode, repo-subpath base)
        working-directory: frontend
        env:
          # Project sites serve under /<repo>/ — set the Vite base to match.
          DOPAMINE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
